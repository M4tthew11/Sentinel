name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # The agent must never reach the network in CI: every job runs the
  # deterministic engine, so results are reproducible and free.
  SENTINEL_AGENT__PROVIDER: rules

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff (lint)
        run: ruff check src tests
      - name: ruff (format)
        run: ruff format --check src tests
      - name: mypy
        run: mypy

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest --cov=sentinel --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  acceptance:
    name: end-to-end evals
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "."
      - name: Replay the incident scenario and score the diagnosis engine
        # Fails the build if the platform stops correctly identifying every
        # injected fault - a regression gate on behaviour, not just on units.
        run: sentinel eval --rules-only --min-accuracy 1.0
      - name: Report the rule baseline on compound and off-catalogue faults
        # Not a gate: the decision tree is expected to fall short here. The
        # numbers are the baseline an LLM engine is compared against.
        run: sentinel eval --rules-only --scenario hard
      - name: Report the rule baseline on recurring faults
        # Not a gate either: the rule engine does not read incident history, so
        # this is the floor for an engine that does.
        run: sentinel eval --rules-only --scenario recurring

  docker:
    name: container image
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sentinel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm sentinel:ci --help
          docker run --rm -e SENTINEL_DATA_DIR=/tmp/data sentinel:ci status
